name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Do not interrupt a release between D1 import and Worker deployment.
concurrency:
  group: research-report-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Determine deployment scope
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Check documentation
        run: npm run docs:check

      - name: Install dependencies
        if: steps.scope.outputs.publish == 'true'
        run: npm ci

      - name: Generate Wrangler config
        if: steps.scope.outputs.publish == 'true'
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/write-wrangler.mjs

      - name: Generate Cloudflare binding types
        if: steps.scope.outputs.publish == 'true'
        run: npm run cf-typegen

      - name: Validate, build, QC, import and deploy
        if: steps.scope.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run research:publish -- vpec-2455 --remote

      - name: Preserve release evidence (including failures)
        if: always() && steps.scope.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: research-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .research-publish/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
