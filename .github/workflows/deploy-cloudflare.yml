name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Wrangler config
        run: node scripts/write-wrangler.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply research-report-db --remote

      - name: Seed 2455 research data
        run: npx wrangler d1 execute research-report-db --remote --file=db/seed/2455.sql

      - name: Deploy Worker
        run: npm run deploy
