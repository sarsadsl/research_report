name: Research Quality PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout change and base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-verification.txt
      - name: Install verification dependencies
        run: python -m pip install --requirement requirements-verification.txt
      - name: Install dependencies
        run: npm ci
      - name: Validate documentation
        run: npm run docs:check
      - name: Validate Research Package and tests
        run: npm run research:check
      - name: Verify signed certificates for changed research packages
        env:
          RESEARCH_VERIFICATION_PUBLIC_KEY: ${{ vars.RESEARCH_VERIFICATION_PUBLIC_KEY }}
        run: node scripts/research-certificate-check.mjs
      - name: Type check
        run: npx tsc --noEmit
      - name: Install CJK fonts for report layout
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Browser report layout QC (existing reference report)
        run: npm run report:qc -- vpec-2455
      - name: Browser report layout QC (UMC 2303 new full report)
        if: ${{ hashFiles('research/umc-2303/research-package.json') != '' }}
        run: npm run report:qc -- umc-2303
      - name: Browser report layout QC (Nanya 1303 new full report)
        if: ${{ hashFiles('research/nanya-1303/research-package.json') != '' }}
        run: npm run report:qc -- nanya-1303
      - name: Browser report layout QC (Delta 2308 draft Full Report)
        if: ${{ hashFiles('research/delta-2308/research-package.json') != '' }}
        run: npm run report:qc -- delta-2308
      - name: Browser report layout QC (Lite-On 2301 draft Full Report)
        if: ${{ hashFiles('research/liteon-2301/research-package.json') != '' }}
        run: npm run report:qc -- liteon-2301
      # Deliberately do not call research:publish --remote, wrangler, or deploy.
      # This workflow never receives Cloudflare credentials and never touches production D1.
