name: Unimicron 3037 Candidate Smoke Test

on:
  push:
    branches:
      - test/unimicron-3037-validation-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-report:
    name: Generate and QC Full Research (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install JS dependencies
        run: npm ci
      - name: Validate Research Package schema
        run: npm run research:validate -- unimicron-3037
      - name: Generate canonical report and seed
        run: npm run research:generate -- unimicron-3037
      - name: Install fonts for browser QC
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Browser report QC
        run: npm run report:qc -- unimicron-3037
      - name: Upload HTML candidate (never deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unimicron-3037-candidate
          path: |
            public/research/reports/unimicron-3037.html
            exports/*unimicron*
          if-no-files-found: warn
          retention-days: 14

  independent-gate:
    name: Verify missing evidence is rejected (no Gemini claims)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python verifier dependencies
        run: python -m pip install -r requirements-verification.txt
      - name: Run independent verification and assert fail-closed
        shell: bash
        run: |
          set +e
          python -m verification validate unimicron-3037 > /tmp/unimicron-verify.json
          ec=$?
          set -e
          echo "Independent verifier exit code: $ec"
          python -c 'import json; d=json.load(open("/tmp/unimicron-verify.json")); print("Verification state:", d.get("status")); assert d.get("status") in ("NOT_VERIFIED","BLOCKED"), "Candidate with no local source evidence must not receive PASS"'
          if [ "$ec" -eq 0 ]; then
            echo "ERROR: independent verifier exited with success despite absent evidence"
            exit 1
          fi
      - name: Upload verification JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unimicron-3037-validation
          path: /tmp/unimicron-verify.json
          if-no-files-found: warn
          retention-days: 14
