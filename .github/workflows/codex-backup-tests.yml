name: Codex Backup Reviewer Tests

on:
  push:
    branches: [feature/codex-audit-fallback-20261120]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-verification.txt
      - name: Existing and fallback verification tests
        run: python -m unittest discover -s verification -t . -v
      # No real Agy/Codex authentication and no publication.
